# Deploy the Vite production build to GitHub Pages (y-gaming.in).
#
# Architecture (docs/TECHNICAL_ARCHITECTURE.md §16):
#   push main → npm ci → npm run build → publish dist/ → GitHub Pages
#
# SPA routing: GitHub Pages has no server rewrite. The build copies
# index.html → 404.html so direct visits / refreshes on /about and
# future client routes (/work, /projects, /explore, /connect) load the
# app. The browser URL stays the requested path; React reads pathname.
#
# Custom domain: public/CNAME is copied into dist by Vite and published
# with the artifact so y-gaming.in remains configured.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
